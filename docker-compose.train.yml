# Training compose file — run on your server alongside the main stack.
# Usage:
#   1. Sync training data from MinIO:  docker compose -f docker-compose.train.yml run --rm sync-training
#   2. Train:                          docker compose -f docker-compose.train.yml run --rm train
#   3. Convert:                        docker compose -f docker-compose.train.yml run --rm convert
#   4. Evaluate:                       docker compose -f docker-compose.train.yml run --rm evaluate
#   5. Restart worker:                 docker compose restart worker

services:
  sync-training:
    image: minio/mc:latest
    volumes:
      - ${CUSTOM_DATA_PATH:-./training/custom_data}:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      echo 'Syncing training data from MinIO...' &&
      mc mirror --overwrite local/training-data /data &&
      echo 'Done. Downloaded to /data:' &&
      ls -la /data/
      "
    networks:
      - afrikaans-transcriber_default

  train:
    build:
      context: .
      dockerfile: training/Dockerfile.train
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    volumes:
      - ./training:/workspace/training
      - ${HF_CACHE_PATH:-./hf_cache}:/workspace/hf_cache
      - ${OUTPUT_PATH:-./training/output}:/workspace/output
      - ${CUSTOM_DATA_PATH:-./training/custom_data}:/workspace/custom_data
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-openai/whisper-small}
      - CV_LANGUAGE=${CV_LANGUAGE:-af}
      - OUTPUT_DIR=/workspace/output
      - CUSTOM_DATA_DIR=/workspace/custom_data
      - NUM_TRAIN_EPOCHS=${NUM_TRAIN_EPOCHS:-3}
      - PER_DEVICE_TRAIN_BATCH_SIZE=${PER_DEVICE_TRAIN_BATCH_SIZE:-4}
      - LEARNING_RATE=${LEARNING_RATE:-1e-5}
    # Uncomment for GPU training:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    command: ["python", "training/train.py"]

  convert:
    build:
      context: .
      dockerfile: training/Dockerfile.train
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    volumes:
      - ${OUTPUT_PATH:-./training/output}:/workspace/output
      - ${CONVERTED_MODEL_PATH:-./models/whisper}:/workspace/converted
    environment:
      - QUANTIZATION=${QUANTIZATION:-int8}
    command: >
      python training/convert.py
        --model_dir /workspace/output
        --output_dir /workspace/converted
        --quantization ${QUANTIZATION:-int8}

  evaluate:
    build:
      context: .
      dockerfile: training/Dockerfile.train
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    volumes:
      - ${OUTPUT_PATH:-./training/output}:/workspace/output
      - ${HF_CACHE_PATH:-./hf_cache}:/workspace/hf_cache
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - CV_LANGUAGE=${CV_LANGUAGE:-af}
    command: ["python", "training/evaluate.py", "--model_dir", "/workspace/output"]

networks:
  afrikaans-transcriber_default:
    external: true
