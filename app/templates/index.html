<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrikaans Transcription Service</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </div>
            <a href="/" class="sidebar-icon active" title="Home">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </a>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="upload-page">
                <div class="upload-header">
                    <h1>Afrikaans Transcription</h1>
                    <p>Upload an audio or video file, or record from your microphone</p>
                </div>

                <!-- Record Card -->
                <div class="record-card">
                    <button id="record-btn" class="btn-record" title="Record from microphone">
                        <svg id="mic-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                        <span id="record-label">Record</span>
                    </button>
                    <div id="recording-status" class="recording-status hidden">
                        <div class="recording-dot"></div>
                        <span id="recording-time">00:00</span>
                    </div>
                </div>

                <div class="divider-or"><span>or</span></div>

                <!-- Upload Card -->
                <div class="upload-card">
                    <form id="upload-form">
                        <div id="drop-zone" class="drop-zone">
                            <div class="drop-icon">
                                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="17 8 12 3 7 8"/>
                                    <line x1="12" y1="3" x2="12" y2="15"/>
                                </svg>
                            </div>
                            <p class="drop-text">Drag file here</p>
                            <p class="drop-hint">or <span class="drop-browse">browse your files</span></p>
                            <p class="drop-formats">WAV, MP3, FLAC, M4A, OGG, MP4, WEBM &mdash; max 500 MB</p>
                            <input type="file" id="file-input" accept=".wav,.mp3,.flac,.m4a,.ogg,.opus,.mp4,.webm,.3gp,.aac" hidden>
                        </div>

                        <div id="file-selected" class="file-selected hidden">
                            <div class="file-selected-info">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                </svg>
                                <span id="file-name"></span>
                                <span id="file-size" class="file-size-badge"></span>
                            </div>
                            <button type="button" id="clear-file" class="btn-icon">&times;</button>
                        </div>

                        <div class="form-row">
                            <label for="email">Email address</label>
                            <input type="email" id="email" placeholder="you@email.com" required>
                        </div>

                        <div id="progress-wrap" class="progress-wrap hidden">
                            <div class="progress-track">
                                <div id="progress-fill" class="progress-fill"></div>
                            </div>
                            <span id="progress-label">0%</span>
                        </div>

                        <button type="submit" id="submit-btn" class="btn-upload" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            Upload &amp; Transcribe
                        </button>
                    </form>
                </div>

                <!-- Recent Jobs -->
                <div id="jobs-section" class="jobs-section hidden">
                    <h2>Recent Transcriptions</h2>
                    <div id="jobs-list" class="jobs-list"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
